name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Check Python types
        if: matrix.python-version == '3.14'
        run: python -m mypy

      - name: Check dashboard JavaScript
        run: node --check automation_inspector/www/app.js

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build production container
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: >-
          docker build
          --build-arg BUILD_ARCH=amd64
          --build-arg BUILD_VERSION=ci
          --tag automation-inspector:ci
          automation_inspector

      - name: Verify image metadata
        run: |
          test "$(docker image inspect automation-inspector:ci --format '{{ index .Config.Labels "io.hass.type" }}')" = "app"
          test "$(docker image inspect automation-inspector:ci --format '{{ .Config.User }}')" = "inspector"