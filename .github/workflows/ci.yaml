name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Check Python types
        if: matrix.python-version == '3.14'
        run: python -m mypy

      - name: Check dashboard JavaScript
        run: node --check automation_inspector/www/app.js

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser and accessibility checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install test dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          npm ci --ignore-scripts

      - name: Verify vendored assets
        run: |
          npm run assets
          git diff --exit-code -- automation_inspector/www/fonts automation_inspector/www/icons automation_inspector/www/licenses

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test finding ignore state
        run: npm test

      - name: Test dashboard workflows and accessibility
        run: npm run test:ui

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Build production container
    runs-on: ubuntu-latest
    needs: [quality, browser]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: >-
          docker build
          --build-arg BUILD_ARCH=amd64
          --build-arg BUILD_VERSION=ci
          --tag automation-inspector:ci
          automation_inspector

      - name: Verify image metadata
        run: |
          test "$(docker image inspect automation-inspector:ci --format '{{ index .Config.Labels "io.hass.type" }}')" = "app"

      - name: Verify the app drops to the unprivileged user
        run: |
          test "$(docker run --rm automation-inspector:ci id -un)" = "inspector"

      - name: Verify Supervisor-owned options are readable after the privilege drop
        run: |
          docker volume create ai-ci-data
          docker run --rm --entrypoint sh -v ai-ci-data:/data automation-inspector:ci -c \
            'printf "{\"refresh_interval\": 987}" > /data/options.json && chown root:root /data/options.json && chmod 600 /data/options.json'
          test "$(docker run --rm -v ai-ci-data:/data automation-inspector:ci python -c 'from app.settings import Settings; print(Settings.load().refresh_interval)')" = "987"
          docker volume rm ai-ci-data